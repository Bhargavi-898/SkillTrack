  <style>
    * {
      box-sizing: border-box;

    body {

    nav.navbar {
      background-color: #2c3e50;
      color: white;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;

    .profile-circle {
      width: 100px;

      border: 3px solid white;

      cursor: pointer;
      transition: box-shadow 0.3s ease;

    .profile-menu-container {

    .profile-menu {

      background-color: white;
      border-radius: 8px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
      padding: 16px 20px;
      display: none;
      color: #444;
      font-size: 14px;
      user-select: none;
      z-index: 2000;

    .profile-menu.show {
      display: block;
    }

    .profile-menu p {
      margin: 8px 0;
      line-height: 1.3;
      font-weight: 600;
      color: #222;
    }

    .profile-menu hr {
      border: none;
      border-top: 1px solid #ddd;
      margin: 14px 0;
    }

    .profile-menu button {
      width: 100%;
      background-color: #3498db;
      border: none;
      color: white;
      padding: 10px 0;
      margin: 6px 0;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;

    .profile-menu button:hover {

    #searchBar {
      display: block;
      margin: 30px auto 20px auto;
      width: 60%;
      max-width: 600px;
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: 1.5px solid #ccc;
      outline-offset: 2px;
      transition: border-color 0.3s ease;
    }

    #searchBar:focus {
      border-color: #3498db;
      box-shadow: 0 0 8px rgba(52, 152, 219, 0.5);
    }

    #videoResults {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      padding: 20px 30px 40px 30px;
      max-width: 1200px;
      margin: 0 auto 60px auto;
    }

    .video-card {
      background-color: white;
      border-radius: 14px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
      padding: 18px 20px 24px 20px;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .video-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.12);
    }

    .video-card h3 {
      margin: 0 0 12px 0;
      font-size: 20px;
      font-weight: 700;
      color: #2c3e50;
    }

    .video-card video {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 14px;
      background: #000;
    }

    .video-card p {
      font-size: 14px;
      margin: 6px 0;
      color: #555;
      flex-grow: 1;
    }

    // Connect socket
const socket = io("http://localhost:3000");


socket.on("notification", (data) => {

  console.log("Notification received:", data);

  const badge = document.getElementById("notificationCount");
  const panel = document.getElementById("notificationPanel");

  if (!badge || !panel) return;

  const div = document.createElement("div");
  div.style.padding = "10px";
  div.style.borderBottom = "1px solid #eee";

  div.innerHTML = `
    <b>${data.message}</b>
    <br>
    <small>${new Date().toLocaleString()}</small>
  `;

  panel.prepend(div);

  let count = Number(badge.textContent) || 0;
  badge.textContent = count + 1;
  badge.style.display = "inline-block";

async function toggleNotifications() {

  const panel = document.getElementById("notificationPanel");
  if (!panel) return;

  const isHidden = window.getComputedStyle(panel).display === "none";

  if (isHidden) {

    panel.style.display = "block";

    try {
      // 1️⃣ Mark notifications as read first
      await markNotificationsAsRead();

      // 2️⃣ Reload notifications (so UI updates)
      await loadNotifications();

      // 3️⃣ Refresh badge
      loadUnreadCount();

    } catch (err) {
      console.error("Toggle notification error:", err);
    }

  } else {

    panel.style.display = "none";

  }

}

function toggleComments(videoId) {

  const section = document.getElementById(`comment-section-${videoId}`);

  if (section.style.display === "none") {

    section.style.display = "block";

    loadComments(videoId);

  } else {

    section.style.display = "none";

  }

}
function loadComments(videoId) {

  fetch(`http://localhost:3000/api/videos/${videoId}/comments`)
    .then(res => res.json())
    .then(comments => {

      const container = document.getElementById(`comments-${videoId}`);
      container.innerHTML = "";

      comments.forEach(c => {

        const div = document.createElement("div");

        div.innerHTML = `
          <b>${c.user?.name || "User"}</b>: ${c.comment}
        `;

        container.appendChild(div);

      });

    })
    .catch(err => console.error("Load comments error:", err));

}
function loadUnreadCount() {

  const token = localStorage.getItem("token");
  if (!token) return;

  const badge = document.getElementById("notificationCount");
  if (!badge) return;

  fetch("http://localhost:3000/api/notifications/unread/count", {
    headers: {
      Authorization: `Bearer ${token}`
    }
  })
  .then(res => {
    if (!res.ok) throw new Error("Failed to fetch count");
    return res.json();
  })
  .then(data => {

    console.log("Unread API response:", data);

    const count = data.count ?? 0;   // safer than Number()

    if (count > 0) {
      badge.style.display = "inline-block";   // ✅ correct for badge
      badge.textContent = count;
    } else {
      badge.style.display = "none";
      badge.textContent = "";
    }

  })
  .catch(err => {
    console.error("Unread count error:", err);
  });

}
async function markNotificationsAsRead() {

  const token = localStorage.getItem("token");
  if (!token) return;

  try {

    const res = await fetch("http://localhost:3000/api/notifications/read-all", {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    if (!res.ok) {
      throw new Error("Failed to mark notifications as read");
    }

    console.log("All notifications marked as read");

    // ✅ DO NOT manually hide badge here
    // Let loadUnreadCount() control badge visibility

  } catch (err) {

    console.error("Mark read error:", err);

  }

}

function loadNotifications() {

  const token = localStorage.getItem("token");

  if (!token) {
    console.error("No token found");
    return;
  }

  fetch("http://localhost:3000/api/notifications", {
    headers: {
      Authorization: `Bearer ${token}`
    }
  })
  .then(res => res.json())
  .then(data => {

    const panel = document.getElementById("notificationPanel");
    const badge = document.getElementById("notificationCount");

    if (!panel || !badge) return;

    panel.innerHTML = "";

    if (!data || data.length === 0) {
      panel.innerHTML = "<p style='padding:15px;'>No notifications</p>";
      badge.style.display = "none";
      return;
    }

    data.forEach(n => {

      const div = document.createElement("div");
      div.style.padding = "10px";
      div.style.borderBottom = "1px solid #eee";
      div.style.cursor = "pointer";

      const senderName = n.sender?.name || "Someone";

      let message = n.message;

      if (!message) {
        if (n.type === "like") {
          message = "liked your video";
        } else if (n.type === "dislike") {
          message = "disliked your video";
        } else if (n.type === "comment") {
          message = "commented on your video";
        } 
        else {
          message = "sent a notification";
        }
      }

      div.innerHTML = `
        <b>${senderName}</b> ${message}
        <br>
        <small>${new Date(n.createdAt).toLocaleString()}</small>
      `;

      panel.appendChild(div);

    });

    loadUnreadCount();

  })
  .catch(err => {
    console.error("Notification error:", err);
  });

}
    function fetchVideos(title = "") {
      fetch("http://localhost:3000/api/videos", {
        headers: { Authorization: `Bearer ${token}` }
      })
        .then(res => res.json())
        .then(data => {
          let filtered = title
            ? data.filter(video => video.title.toLowerCase().includes(title.toLowerCase()))
            : data;
          displayVideos(filtered);
        })
        .catch(err => console.error("Error fetching videos:", err));
    }

    function displayVideos(videos) {
      const container = document.getElementById("videoResults");
      container.innerHTML = "";

      if (videos.length === 0) {
        container.innerHTML = "<p>No videos found.</p>";
        return;

      videos.forEach(video => {
        const videoCard = document.createElement("div");
        videoCard.className = "video-card";
        videoCard.setAttribute("data-video-id", video._id);
        const uploader = video.uploadedBy || {};
        const uploaderId = uploader._id || "";
        const uploaderName = uploader.name || "Unknown";
        const uploaderEmail = uploader.email || "N/A";
        const uploaderBranch = uploader.branch || "N/A";
        const uploaderYear = uploader.year || "N/A";

        const videoSrc = video.url.startsWith("/")
          ? `http://localhost:3000${video.url}`
          : video.url;

        const photoSrc = uploader.profilePhoto
          ? (uploader.profilePhoto.startsWith("uploads/")
              ? `http://localhost:3000/${uploader.profilePhoto}`
              : uploader.profilePhoto)
          : `https://ui-avatars.com/api/?name=${encodeURIComponent(uploaderName)}&background=random&rounded=true`;

        const detailsId = `details-${video._id}`;

      videoCard.setAttribute("data-video-id", video._id);  // 🔥 IMPORTANT for real-time

videoCard.innerHTML = `
  <h3>${video.title}</h3>

  <video controls onplay="registerView('${video._id}')">
    <source src="${videoSrc}" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <p><strong>Description:</strong> ${video.description || "No description available"}</p>

  <div class="uploader-info">
    <img src="${photoSrc}"

    </span>

      <i class="fas fa-thumbs-up"></i>
      <span class="like-count">${video.likes.length}</span>
    </button>

    <button onclick="toggleDislike('${video._id}', this)" 
            class="action-btn ${video.dislikes?.includes(userData._id) ? 'disliked' : ''}">
      <i class="fa-solid fa-thumbs-down"></i>
      <span class="dislike-count">${video.dislikes?.length || 0}</span>
    </button>

    <div class="view-info">

Post

function postComment(videoId) {

  const input = document.getElementById(`comment-input-${videoId}`);
  const text = input.value.trim();

  if (!text) return;

  fetch(`http://localhost:3000/api/videos/${videoId}/comment`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${token}`
    },
    body: JSON.stringify({ text })
  })
  .then(res => res.json())
  .then(() => {
    input.value = "";
  })
  .catch(err => console.error("Comment error:", err));
}

    
function toggleLike(videoId, button) {
  const token = localStorage.getItem("token");
  if (!token) {
    alert("You must be logged in to like a video.");
    return;
  }

  fetch(`http://localhost:3000/api/videos/toggle-like/${videoId}`, {
    method: "POST",
    headers: {
      Authorization: `Bearer ${token}`,
    },
  })
    .then((res) => res.json())
    .then((data) => {
      const countSpan = button.querySelector(".like-count");

      // Update Like UI
      if (data.liked) {
        button.classList.add("liked");
      } else {
        button.classList.remove("liked");
      }
      countSpan.textContent = data.totalLikes;

      // Remove Dislike if present
      const dislikeButton = button
        .closest(".video-actions")
        .querySelector(".action-btn.disliked");
      if (dislikeButton) {
        dislikeButton.classList.remove("disliked");
        const dSpan = dislikeButton.querySelector(".dislike-count");
        if (dSpan) {
          dSpan.textContent = String(Number(dSpan.textContent) - 1);
        }
      }
    })
    .catch((err) => {
      console.error("Like toggle failed:", err);
      alert("Like action failed. Please try again.");
    });
}


function toggleDislike(videoId, button) {
  const token = localStorage.getItem("token");
  if (!token) {
    alert("You must be logged in to dislike a video.");
    return;
  }

  fetch(`http://localhost:3000/api/videos/toggle-dislike/${videoId}`, {
    method: "POST",
    headers: {
      Authorization: `Bearer ${token}`,
    },
  })
    .then(async (res) => {
      if (!res.ok) {
        const text = await res.text();
        throw new Error(text);
      }
      return res.json();
    })
    .then((data) => {
      const countSpan = button.querySelector(".dislike-count");

      if (data.disliked) {
        button.classList.add("disliked");
      } else {
        button.classList.remove("disliked");
      }

      countSpan.textContent = data.totalDislikes;

      // Remove like if it was liked
      const likeButton = button
        .closest(".video-actions")
        .querySelector(".action-btn.liked");

      if (likeButton) {
        likeButton.classList.remove("liked");
        const lSpan = likeButton.querySelector(".like-count");
        if (lSpan) {
          lSpan.textContent = String(Math.max(0, Number(lSpan.textContent) - 1));
        }
      }
    })
    .catch((err) => {
      console.error("Dislike toggle failed:", err);
      alert("Dislike action failed. Please try again.");
    });
}
const viewedVideos = new Set(JSON.parse(localStorage.getItem("viewedVideos") || "[]"));

function registerView(videoId) {
  if (viewedVideos.has(videoId)) return;
  viewedVideos.add(videoId);
  localStorage.setItem("viewedVideos", JSON.stringify([...viewedVideos]));

  fetch(`http://localhost:3000/api/videos/view/${videoId}`, {
    method: "POST",
    headers: { Authorization: `Bearer ${token}` }
  })
    .then(res => res.json())
    .then(data => {
      const videoCard = document.querySelector(`[data-video-id="${videoId}"]`);
      const viewCountSpan = videoCard?.querySelector(".view-count");
      if (viewCountSpan) {
        viewCountSpan.textContent = data.updatedViews;
      }
    })
    .catch(err => console.error("Error registering view:", err));
}
